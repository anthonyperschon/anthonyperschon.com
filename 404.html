<!doctype html>
<html lang="en">
<head>

<meta property="og:description" content="Nothing here.">

<link rel="manifest" href="/site.webmanifest">

<link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" sizes="any" href="/assets/brand/ap-mark.svg">
<link rel="mask-icon" href="/assets/brand/ap-mask.svg" color="#3f5f66">
<meta name="theme-color" content="#0b0e14">
<style>
  @font-face { font-family: "Big Shoulders Display"; font-weight: 600; font-style: normal; font-display: swap; src: url("/fonts/big-shoulders-600.woff2") format("woff2"); }
  @font-face { font-family: "Big Shoulders Display"; font-weight: 800; font-style: normal; font-display: swap; src: url("/fonts/big-shoulders-800.woff2") format("woff2"); }
  @font-face { font-family: "Figtree"; font-weight: 300 900; font-style: normal; font-display: swap; src: url("/fonts/figtree-variable.woff2") format("woff2"); }
  :root { --black-ice: #070c12; --deep-water: #0e1822; --card: #132232; --frost: #eaf2f7; --slate: #93a4b3; --note: #8fa2b1;
          --brand: #06485c; --line: rgba(234,242,247,.13);
          --display: "Big Shoulders Display"; --body: "Figtree"; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--black-ice); }
  body { background: var(--black-ice); color: var(--frost); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 18px; }
  section { padding: 56px 0; border-top: 1px solid var(--line); }
  /* the brand rule sits under section headings only (job 2026-10-12-009); hairlines everywhere else */
  .eyebrow { font: 800 34px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; color: var(--frost); margin-bottom: 22px;
             padding-bottom: 12px; border-bottom: 3px solid var(--brand); }
  .wordmark { font: 600 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--slate); text-decoration: none; }   /* matches MENU */

  /* hero. Phone: the photo full bleed from the top edge, a fade from the middle to the page ground, the headline, the
     three numbers and the button on the dark lower third, all inside the first screen. Desktop: text left, photo right. */
  .hero { position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .hero .top { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px;
               padding-top: 20px; padding-bottom: 20px; width: 100%; }
  /* header tabs (job 2026-10-12-010): the label style, slate, frost on hover; at phone width they take their own row under
     the wordmark, full width, spread out, never wrapping mid-row and never shrinking the wordmark */
  .top { flex-wrap: wrap; }
  /* the AP mark alone is the home link (job 2026-10-13-019): 26 px at every width (job 020). The link stays 22 px tall,
     as in 018, and the mark overflows it evenly, so the header keeps its height; the mark is nudged onto the nav's centre */
  .top .wordmark { flex: none; display: inline-flex; align-items: center; height: 22px; }
  .wordmark .apmark { display: block; height: 26px; width: auto; flex: none; }
  .tabs-nav { display: flex; gap: 28px; white-space: nowrap; }
  .tabs-nav a { font: 600 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--slate); text-decoration: none; padding: 6px 0; }
  .tabs-nav a:hover, .tabs-nav a:focus-visible { color: var(--frost); }
  /* phone layout pass (12 Oct 2026): under 900 the header is one row, the wordmark and MENU; MENU opens a full-screen
     panel, the four links stacked large, CLOSE top right. 900 and up: the four tabs inline, no MENU. */
  /* .wrap.top, not .top (job 2026-10-14-009): the 700 px ".wrap { padding: 0 32px }" comes later and zeroed this padding
     on the three work pages from 700 px, so their header sat on the top edge */
  .wrap.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 20px; padding-bottom: 20px; }
  .tabs-nav { display: none; }
  .menu-btn, .menu-close { background: none; border: 0; padding: 6px 0; cursor: pointer; font: 600 12px/1 var(--display); letter-spacing: .16em;
                           text-transform: uppercase; color: var(--slate); }
  .menu-btn:hover, .menu-close:hover, .menu-btn:focus-visible, .menu-close:focus-visible { color: var(--frost); }
  .menu { position: fixed; inset: 0; z-index: 50; background: var(--black-ice); padding: 20px 18px; }
  .menu-close { position: absolute; top: 20px; right: 18px; font-size: 14px; color: var(--frost); }   /* the nav text size (job 2026-10-15-011, 4) */
  .menu nav { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; margin-top: 96px; }
  .menu nav a { font: 800 40px/1 var(--display); text-transform: uppercase; color: var(--frost); text-decoration: none; }
  /* the second group, smaller, then one contact line: the email and the three platform icons, as in the footer */
  .menu nav.m2 { gap: 14px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
  .menu nav.m2 a { font: 600 22px/1 var(--display); letter-spacing: .04em; color: #c9d6df; }
  .menu .mcontact { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin-top: 40px; font-size: 15px; }
  .menu .mmail { color: var(--frost); text-decoration: underline; text-decoration-color: var(--brand); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .icons { display: inline-flex; gap: 20px; align-items: center; }
  .icons a { display: block; color: var(--frost); text-decoration: none; border: 0; line-height: 0; }
  .icons svg { display: block; width: 24px; height: 24px; }
  html.menu-open, html.menu-open body { overflow: hidden; }
  /* the plain hero rules sit ahead of the 900 px query so HERO_POS_DESK wins at 900 and up (13 Oct 2026) */
  .hero .pic { position: absolute; inset: 0; }
  .hero .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 59% 30%; }
  /* the phone headline and kicker sizes sit here too, ahead of the query, so 72 / 40 and the 14 px kicker win at 900 and up
     (job 2026-10-14-010) */
  .kicker { font: 600 12px/1.2 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--slate); margin-top: 12px; }
  .hero h1 .l1 { font-size: 40px; color: var(--frost); }
  .hero h1 .l2 { font-size: 24px; color: var(--slate); margin-top: 4px; }
  @media (min-width: 900px) {
    .hero .herobtn a.btn { flex: none; height: 52px; padding: 0 26px; }
    .hero .pic img { object-position: 59% 40%; }
    .hero h1 .l1 { font-size: 72px; }
    .hero h1 .l2 { font-size: 40px; }
    .kicker { font-size: 14px; margin-top: 16px; }
    .tabs-nav { display: flex; }
    .tabs-nav a { font-size: 14px; }
    .menu-btn, .menu { display: none !important; }
  }
  /* hero rebuild (12 Oct 2026): the first screen is the photo. A top scrim for the header, a fade to the page ground over
     the bottom 35 percent, and two text pieces bottom-left: the headline and one label line. The rest waits in the intro. */
  .hero .pic::after { content: ""; position: absolute; inset: 0;
                      background: linear-gradient(180deg, rgba(7,12,18,.45) 0%, rgba(7,12,18,0) 12%, rgba(7,12,18,0) 65%, var(--black-ice) 100%); }
  .hero .copy { position: relative; z-index: 2; width: 100%; margin-top: auto; padding: 0 20px 28px; }
  /* the headline in two weights (5:31 PM pass): the first line frost and larger, the second slate */
  .hero h1 { line-height: .95; text-shadow: 0 2px 20px rgba(7,12,18,.5); }
  /* short phone screens (job 2026-10-14-010): under 740 px tall the headline steps down and the gaps tighten, so the two
     buttons sit clear of the bottom edge with the face left free. The header bar keeps its padding (the AP mark stays 19 px down). */
  @media (max-width: 899px) and (max-height: 740px) {
    .hero h1 .l1 { font-size: 34px; }
    .hero h1 .l2 { font-size: 20px; }
    .hero .kicker { margin-top: 8px; }
    .hero .herobtn { margin-top: 12px; }
    .hero .copy { padding-bottom: 32px; }
  }
  /* two buttons side by side, one height and radius, label style 14px: WORK WITH ME filled, LIVE STATS outlined; on the
     phone they share the column with 12px between */
  .herobtn { display: flex; gap: 12px; margin-top: 16px; }
  .herobtn a.btn { flex: 1 1 0; height: 48px; padding: 0 12px; font: 600 14px/1 var(--display); letter-spacing: .16em; }
  a.btn.ghost { background: none; border: 1px solid rgba(234,242,247,.7); color: var(--frost); }
  /* the photo holds still: one fixed screen height, nothing scales or moves with the scroll */
  .hero { height: 100svh; }   /* until the script writes the pixel height at load; no vh, lvh or dvh on the hero */
  .hero .pic picture { display: block; width: 100%; height: 100%; }
  .hero h1 .l { white-space: nowrap; }
  /* the intro, the second screen: the sentence, the three numbers, the button and Live stats */
  section.intro { border-top: 0; padding: 48px 0; }
  .lead { font-size: 17px; line-height: 1.5; color: var(--frost); }
  /* phone: 42px, line height .95; each sentence its own line (44px wrapped the second at 390) */
  h1 { font: 800 42px/.95 var(--display); letter-spacing: .005em; text-transform: uppercase; }
  h1 .l { display: block; text-wrap: balance; }   /* at 42 the second sentence (430px) still breaks at 390: it breaks evenly */
  .bio { font-size: 16px; line-height: 1.5; color: #c9d6df; margin-top: 14px; max-width: 34em; }
  /* phone: the stats row keeps a 16px right gutter beyond the column's own edge, so 84% has air */
  .stats { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 8px; margin-top: 16px; padding-right: 16px; }
  .stat b { display: block; font: 800 min(40px, 9.6vw)/1 var(--display); color: var(--frost); white-space: nowrap; }
  .stat span { display: block; font-size: 13px; color: var(--slate); margin-top: 4px; }
  /* phone: WORK WITH ME full width, Live stats centred under it; desktop side by side */
  .cta { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 18px; }
  .cta a.btn { width: 100%; }
  .live { font-size: 15px; text-decoration: none; border-bottom: 1px solid rgba(234,242,247,.6); }
  /* the one button: filled brand, frost text */
  a.btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 22px; border-radius: 4px;
          background: var(--brand); color: var(--frost); font: 600 15px/1 var(--display); letter-spacing: .12em; text-transform: uppercase;
          text-decoration: none; cursor: pointer; }
  a.btn:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }
  /* pressed state (job 2026-10-15-011, 3), one rule: text links and icons dim to 70 percent, filled buttons darken 10 percent, 80 ms */
  a, button { transition: opacity 80ms ease, filter 80ms ease; } a:active, button:active { opacity: .7; } a.btn:not(.ghost):active { opacity: 1; filter: brightness(.9); }

  /* video cards (job 2026-10-15-011, 9 and 12): one style on every page. The still with the play mark, then the title
     and the lines on the page ground; the counts are linked words. Wide is 16:9 (YouTube), tall is 4:5 (Reels, posts). */
  .tiles { display: grid; grid-template-columns: 1fr; gap: 28px; margin-top: 18px; }
  .card .media { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; background: var(--card); overflow: hidden; }
  .card.tall .media { aspect-ratio: 4 / 5; }
  .card .media img { width: 100%; height: 100%; object-fit: cover; }
  .card .t { font-size: 17px; font-weight: 600; line-height: 1.3; color: var(--frost); margin-top: 12px; }
  .card .t a { text-decoration: none; }
  .card .d { font-size: 14px; line-height: 1.45; color: var(--slate); margin-top: 4px; }
  .card .d a { color: #c9d6df; text-decoration: underline; text-decoration-color: rgba(234,242,247,.35); text-underline-offset: 3px; }
  .card a:focus-visible { outline: 2px solid var(--frost); outline-offset: 4px; }
  /* the counts as ghost buttons (job 2026-10-16-044): 1 px accent border, no fill, 13 px label, square corners, the
     primary button's height, 8 px apart, left-aligned; hover fills with the accent; at 390 they wrap onto their own lines */
  .cbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .wrap > .tiles { margin-bottom: 56px; }   /* the cards' buttons clear the next section's rule (job 044) */
  .wrap > .tiles.noted { margin-bottom: 44px; }
  a.btn.cbtn { height: 48px; padding: 0 16px; border-radius: 0; background: transparent; border: 1px solid #3a7590; color: var(--frost);
               font-size: 13px; letter-spacing: .1em; }   /* the accent lifted for contrast (job 046) */
  a.btn.cbtn:hover, a.btn.cbtn:focus-visible { background: #06485c; }
  /* 6: each card a flex column, the buttons on margin-top auto, so a row's buttons line up when a title wraps (job 046) */
  .card { display: flex; flex-direction: column; }
  .card .cbtns { margin-top: auto; padding-top: 12px; }
  .countnote { font-size: 13px; color: var(--slate); margin: -32px 0 56px; padding-top: 14px; border-top: 1px solid var(--line); }
  .case-note { margin: 18px 0 0; }
  /* the home page's three cover tiles, one per group; the whole tile is the link */
  .covers { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .cover .tm { aspect-ratio: 16 / 9; }
  /* work pages: the group name, its line, the way back */
  .work-head { padding: 28px 0 28px; }
  .work-head h1 { font-size: 34px; }
  .wl { font-size: 16px; color: #c9d6df; margin-top: 10px; }
  .backwork { display: inline-block; margin-top: 14px; font: 600 12px/1.2 var(--display); letter-spacing: .16em; text-transform: uppercase;
              color: var(--slate); text-decoration: none; }
  .backwork:hover, .backwork:focus-visible { color: var(--frost); }

  /* the numbers: one table at every width */
  .ntable { margin-top: 4px; }
  .nrow { padding: 18px 0; border-top: 1px solid var(--line); }
  .nrow:first-child { border-top: 0; padding-top: 4px; }
  /* row header: the platform's mark and name, one link to the profile, nothing underlined */
  .nk { font: 600 12px/1.2 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--slate); }
  .nk a { display: inline-flex; align-items: center; gap: 8px; color: var(--slate); text-decoration: none; }
  .nk svg { color: var(--frost); flex: none; }
  .nk a:hover, .nk a:focus-visible { color: var(--frost); }
  .nvs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .nv b { display: block; font: 800 32px/1 var(--display); color: var(--frost); white-space: nowrap; }
  .nv span { display: block; font-size: 13px; color: var(--slate); margin-top: 4px; }
  .small { font-size: 13px; color: var(--slate); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .aud { font-size: 15px; color: #c9d6df; margin-top: 12px; }

  /* services: five cover strips, 1920 x 820, each with its line under it; the card colour until a photo lands */
  .svcs { display: grid; grid-template-columns: 1fr; gap: 24px; margin-top: 4px; }
  .strip .tm { aspect-ratio: 1920 / 820; }
  .strip.full .tm { aspect-ratio: 16 / 9; }   /* the whole frame, no crop (Retainer, job 2026-10-16-004) */

  /* tiles and strips (job 2026-10-15-011, 5 and 6), one rule at every width: the title on the photo bottom-left, the arrow
     bottom-right at rest, no gradient; under the photo, on the page ground, the line (and the proof line on a cover),
     always shown. One tap opens the page. From 900 px a hover lifts the photo and draws the frost edge. The only thing drawn
     on the photo is the title band (job 2026-10-16-004). */
  .tile { display: block; position: relative; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .tile .tm { position: relative; display: block; overflow: hidden; background: var(--card); }
  /* the title band (job 2026-10-16-004): page ground to transparent over the bottom 40 percent, behind every cover and
     strip title, so no title sits bare on a photo; the arrow and title sit above it */
  .tile .tm::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; z-index: 1; pointer-events: none;
                      background: linear-gradient(0deg, var(--black-ice) 0%, rgba(7,12,18,0) 100%); }
  .tile .tm picture, .tile .tm img { display: block; width: 100%; height: 100%; }
  .tile .tm img { object-fit: cover; transition: transform 250ms ease; }
  .tile .tm::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
                     box-shadow: inset 0 0 0 1px rgba(234,242,247,.6); transition: opacity 250ms ease; }
  .tile .go { position: absolute; z-index: 3; right: 14px; bottom: 14px; width: 30px; height: 30px; border-radius: 50%;
              display: flex; align-items: center; justify-content: center; color: var(--black-ice); background: var(--frost); }
  .tile .go svg { display: block; width: 12px; height: 12px; }
  .tile .tt { position: absolute; z-index: 2; left: 16px; right: 56px; bottom: 16px; font: 700 17px/1.2 var(--body);
              letter-spacing: .2em; text-transform: uppercase; color: var(--frost); text-shadow: 0 2px 12px rgba(0,0,0,.65); }
  /* strips 03 and 05 and the Campaigns tile, the light frames (011 b and final): the title on a scrim, the deck chip's rule (deck.py .logo-scrim): black at
     40 percent, soft edge, rounded, sized to the title plus 4 percent padding. Nothing else is drawn on the photo. */
  .tile.pale .tt { right: auto; max-width: calc(100% - 72px); border-radius: 8px; background: rgba(0,0,0,.4);
                   box-shadow: 0 0 18px 9px rgba(0,0,0,.4); text-shadow: none; }
  .tile .ds { display: block; padding: 10px 2px 0; font: 400 14px/1.45 var(--body); color: var(--slate); }
  .tile .ds span { display: block; }
  .tile .ds .pf { color: #c9d6df; margin-top: 2px; }
  .tile:focus-visible { outline: 2px solid var(--frost); outline-offset: 4px; }
  @media (max-width: 699px) { .tile .tt { font-size: 15px; letter-spacing: .12em; } }   /* one line for the long strip names at 390 */
  @media (max-width: 379px) { .tile .tt { font-size: 14px; letter-spacing: .08em; } }
  @media (min-width: 1100px) { .tile.cover .tt { letter-spacing: .14em; } }
  @media (min-width: 700px) and (max-width: 1099px) { .tile.cover .tt { font-size: 15px; letter-spacing: .02em; } }
  @media (hover: hover) and (min-width: 900px) {
    .tile:hover .tm::after { opacity: 1; }
    .tile:hover .tm img { transform: scale(1.03); }
  }
  @media (prefers-reduced-motion: reduce) { .tile .tm img, .tile .tm::after { transition: none; } }

  /* partners: five equal 120 x 44 boxes, each mark contained, frost at .85; three columns at 390, one row of five on desktop */
  /* partners: each mark contained in a 120 x 44 box (the 15 Oct sizing, restored in job 047); at 390 a two-column grid
     with 24 px gutters, inside the column (job 046) */
  .logos { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 8px; align-items: center; justify-items: center; }
  .lbox { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 120px; aspect-ratio: 120 / 44; }
  .lbox img { width: 100%; height: 100%; object-fit: contain; opacity: .85; }

  /* contact and footer (job 2026-10-15-011, 1, 7 and 15): the email underlined in brand with Live stats under it, no
     phone and no button; the footer has the wordmark, the plain email and the three icons, right-aligned from 700 px and
     under the email on a phone */
  /* job 2026-10-15-017: one button with the prefilled mailto, the address in plain text under it, the reply line */
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  section[id] { scroll-margin-top: 16px; }
  .contact p { margin-top: 12px; }
  .contact p.btnrow { margin-top: 20px; }

  /* WORK WITH ME (job 2026-10-16-044): the Services rhythm; copy left and the form right from 900 px, one column below.
     Inputs are an underline only: 1 px slate at rest, accent on focus, no boxes. The route pills are square, a line
     under the label; the chosen one gets a 2 px accent border and no fill. */
  .wwm-copy p { font-size: 17px; line-height: 1.5; color: #c9d6df; }
  .wwm-grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
  #brief { display: grid; gap: 22px; }
  .frow.two { display: grid; grid-template-columns: 1fr; gap: 22px; }
  .fld { display: block; }
  .flabel { display: block; font: 600 12px/1.2 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--slate); margin-bottom: 8px; padding: 0; }
  #brief input[type=text], #brief input[type=email], #brief select, #brief textarea { display: block; width: 100%; background: transparent;
      border: 0; border-bottom: 1px solid var(--slate); border-radius: 0; color: var(--frost); font: 400 16px/1.4 var(--body); padding: 8px 0;
      -webkit-appearance: none; appearance: none; }
  #brief select { background-image: linear-gradient(45deg, transparent 50%, var(--slate) 50%), linear-gradient(135deg, var(--slate) 50%, transparent 50%);
      background-position: right 6px top 55%, right 0 top 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 20px; }
  #brief select option { background: var(--deep-water); color: var(--frost); }
  #brief textarea { resize: none; min-height: 120px; }
  #brief input:focus, #brief select:focus, #brief textarea:focus { outline: none; border-bottom-color: var(--brand); box-shadow: 0 1px 0 0 var(--brand); }
  #brief ::placeholder { color: rgba(147,164,179,.7); }
  .routes { border: 0; display: grid; grid-template-columns: 1fr; gap: 10px; }
  .routes legend { margin-bottom: 8px; }
  .rpill { position: relative; display: block; padding: 12px 14px; border: 1px solid var(--line); cursor: pointer; }
  .rpill input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rpill .rl { display: block; font: 600 14px/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--frost); }
  .rpill .rd { display: block; font-size: 14px; line-height: 1.4; color: var(--slate); margin-top: 4px; }
  .rpill:has(input:checked), .rpill[aria-checked="true"] { border: 2px solid var(--brand); padding: 11px 13px; background: #06485c; }
